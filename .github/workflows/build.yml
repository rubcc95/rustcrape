name: Build Windows

on:
  push:
    branches: [chromiumoxide]  
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: rustcraper-gui

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rustcraper-gui/package-lock.json

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /target
          key: cargo-windows-${{ hashFiles('rustcraper-gui/src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Rustcraper-Windows-installers
          path: target/release/bundle/

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Rustcraper-Windows-portable
          path: target/release/rustcraper-gui.exe