[package]
name = "rustcrape"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chromiumoxide = "0.9"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "sqlite"] }
thiserror = "2.0.20"
derive_more = { version = "2", features = ["deref", "deref_mut"] }
